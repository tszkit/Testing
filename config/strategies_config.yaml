momentum:
  lookback: 20
  min_adx: 25
  rsi_min: 45
  rsi_max: 65
  volume_surge: 1.5          # volume must be 1.5x 20-day average
  ma_fast: 9
  ma_slow: 21
  trend_filter: true         # price must be above 50-day MA

mean_reversion:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  min_reversion_pct: 0.5    # price must be at least 0.5% outside band
  max_adx: 30               # avoid strong trends

breakout:
  consolidation_bars: 10    # look for 10-bar tight range
  range_max_pct: 3.0        # consolidation range < 3%
  volume_confirm: 2.0        # breakout needs 2x average volume
  atr_multiplier: 1.0        # stop loss = 1 ATR below breakout
